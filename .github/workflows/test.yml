name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate templates
        run: go tool templ generate

      - name: Check gofmt
        run: make fmt-check

      - name: Check templ formatting
        run: make templ-check

      - name: Run go vet
        run: make vet

      - name: Run Go tests
        run: make test-go

      - name: Run Go tests with the race detector
        run: make test-race

      - name: Run integration test suite
        run: make test

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test/js/playwright-report
            test/js/test-results
          if-no-files-found: ignore
          retention-days: 7
