name: neuralnexus-frontend-test

services:
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: https://api.neuralnexus.dev
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/"]
      interval: 2s
      timeout: 3s
      retries: 15

  playwright:
    image: mcr.microsoft.com/playwright:v1.56.1-noble
    working_dir: /work
    volumes:
      - ./integration:/work
    environment:
      BASE_URL: http://frontend:8090
      API_BASE_URL: https://api.neuralnexus.dev
    depends_on:
      frontend:
        condition: service_healthy
    command: sh -c "npm ci && npx playwright test"
